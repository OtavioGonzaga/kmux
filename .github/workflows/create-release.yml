name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without a v prefix or build metadata
        required: true
        type: string

permissions: {}

env:
  RELEASE_RUST_VERSION: "1.89.0"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  preflight:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      prepared: ${{ steps.state.outputs.prepared }}
      release_commit_sha: ${{ steps.state.outputs.release_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          bash scripts/release-state.sh --main-ref origin/main "$VERSION" >> "$GITHUB_OUTPUT"

  prepare:
    needs: preflight
    if: needs.preflight.outputs.prepared == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_commit_sha: ${{ steps.commit.outputs.release_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          bash scripts/prepare-release.sh "$VERSION"
          changed="$(git diff --name-only)"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | grep -Ev '^(Cargo\.toml|Cargo\.lock|CHANGELOG\.md)$' || true)" = ""
          cargo check --locked
          cargo test --all-targets
      - id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore(release): v$VERSION"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [preflight, prepare]
    if: always() && !failure() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup toolchain install "$RELEASE_RUST_VERSION" --profile minimal
      - run: rustup target add --toolchain "$RELEASE_RUST_VERSION" ${{ matrix.target }}
      - env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          cargo +"$RELEASE_RUST_VERSION" build --release --locked --target "$TARGET"
          mkdir dist
          install -m 755 "target/$TARGET/release/kmux" dist/kmux
          test "$(dist/kmux --version)" = "kmux $VERSION"
          dist/kmux --help >/dev/null
          file dist/kmux | grep -Eq 'statically linked|static-pie'
          ! readelf -l dist/kmux | grep -Fq 'Requesting program interpreter'
          tar -czf "kmux-linux-$ASSET.tar.gz" -C dist kmux -C .. LICENSE README.md CHANGELOG.md
          sha256sum "kmux-linux-$ASSET.tar.gz" > "kmux-linux-$ASSET.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmux-linux-${{ matrix.asset }}
          path: |
            dist/kmux
            kmux-linux-${{ matrix.asset }}.tar.gz
            kmux-linux-${{ matrix.asset }}.tar.gz.sha256

  deb:
    needs: [preflight, prepare, build]
    if: always() && !failure() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: x86_64
            arch: amd64
          - runner: ubuntu-24.04-arm
            asset: aarch64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kmux-linux-${{ matrix.asset }}
          path: .
      - env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          DEB_UPSTREAM_VERSION="$(bash scripts/debian-version.sh --upstream "$VERSION")"
          DEB_VERSION="$(bash scripts/debian-version.sh "$VERSION")"
          deb="kmux_${VERSION}_${ARCH}.deb"
          export DEB_UPSTREAM_VERSION
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          "$HOME/go/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$DEB_VERSION"
          dpkg-deb --contents "$deb" > deb-contents.txt
          grep -Fq './usr/bin/kmux' deb-contents.txt
          mkdir extracted
          dpkg-deb -x "$deb" extracted
          test "$(stat -c '%a' extracted/usr/bin/kmux)" = "755"
          test -x extracted/usr/bin/kmux
          cmp dist/kmux extracted/usr/bin/kmux
          sudo dpkg -i "$deb"
          test "$(kmux --version)" = "kmux $VERSION"
          kmux --help >/dev/null
          sudo dpkg -r kmux
          sha256sum "$deb" > "$deb.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmux-deb-${{ matrix.arch }}
          path: kmux_${{ inputs.version }}_${{ matrix.arch }}.deb*

  validate-artifacts:
    needs: [preflight, prepare, deb]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kmux-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - env:
          VERSION: ${{ inputs.version }}
          ASSETS: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          assets=(
            kmux-linux-x86_64.tar.gz
            kmux-linux-aarch64.tar.gz
            kmux-linux-x86_64.tar.gz.sha256
            kmux-linux-aarch64.tar.gz.sha256
            "kmux_${VERSION}_amd64.deb"
            "kmux_${VERSION}_arm64.deb"
            "kmux_${VERSION}_amd64.deb.sha256"
            "kmux_${VERSION}_arm64.deb.sha256"
          )
          for asset in "${assets[@]}"; do test -f "$ASSETS/$asset"; done
          cargo publish --dry-run --locked
          (
            cd "$ASSETS"
            sha256sum kmux-linux-*.tar.gz "kmux_${VERSION}_"*.deb > SHA256SUMS
          )
          bash scripts/extract-release-notes.sh "$VERSION" > "$ASSETS/release-notes.md"
          {
            printf '\n## Installation\n\n'
            printf 'Cargo: `cargo install ssh-kmux --version %s`\n\n' "$VERSION"
            printf 'Debian/Ubuntu: download the matching `.deb` and run `sudo dpkg -i kmux_%s_ARCH.deb`.\n\n' "$VERSION"
            printf 'Tarball: download `kmux-linux-ARCH.tar.gz` and verify assets with `sha256sum -c SHA256SUMS`.\n'
          } >> "$ASSETS/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kmux-release-assets
          path: ${{ runner.temp }}/release-assets

  publish-crate:
    needs: [preflight, prepare, validate-artifacts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      - env:
          VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          crate_exists() {
            cargo info "ssh-kmux@$VERSION" --registry crates-io >/dev/null 2>&1
          }
          if crate_exists; then
            echo "ssh-kmux $VERSION is already published"
          elif ! cargo publish --locked; then
            crate_exists || exit 1
          fi

  finalize-github:
    needs: [preflight, prepare, validate-artifacts, publish-crate]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kmux-release-assets
          path: ${{ runner.temp }}/release-assets
      - env:
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
          ASSETS: ${{ runner.temp }}/release-assets
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          crate_exists() {
            cargo info "ssh-kmux@$VERSION" --registry crates-io >/dev/null 2>&1
          }
          crate_exists
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" = "$VERSION"
          grep -Fq "## [$VERSION]" CHANGELOG.md
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "$tag^{}")" = "$RELEASE_COMMIT"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$tag" "$RELEASE_COMMIT" --message "Release v$VERSION"
            git push origin "$tag"
          fi
          assets=(
            kmux-linux-x86_64.tar.gz
            kmux-linux-aarch64.tar.gz
            kmux-linux-x86_64.tar.gz.sha256
            kmux-linux-aarch64.tar.gz.sha256
            "kmux_${VERSION}_amd64.deb"
            "kmux_${VERSION}_arm64.deb"
            "kmux_${VERSION}_amd64.deb.sha256"
            "kmux_${VERSION}_arm64.deb.sha256"
            SHA256SUMS
          )
          for asset in "${assets[@]}"; do test -f "$ASSETS/$asset"; done
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
              gh release upload "$tag" "${assets[@]/#/$ASSETS/}" --clobber
              gh release edit "$tag" --draft=false
            else
              for asset in "${assets[@]}"; do
                gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"
              done
            fi
          else
            prerelease=()
            case "$VERSION" in *-*) prerelease=(--prerelease);; esac
            gh release create "$tag" --draft "${prerelease[@]}" --title "$tag" --notes-file "$ASSETS/release-notes.md"
            gh release upload "$tag" "${assets[@]/#/$ASSETS/}"
            gh release edit "$tag" --draft=false
          fi
