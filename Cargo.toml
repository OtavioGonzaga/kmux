[package]
name = "ssh-kmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Run commands with a filtered view of an SSH agent"
license = "MIT"
publish = ["crates-io"]
categories = ["command-line-utilities", "authentication"]
keywords = ["ssh", "agent", "security"]
repository = "https://github.com/OtavioGonzaga/kmux"
readme = "README.md"

[lib]
name = "kmux"
path = "src/lib.rs"

[[bin]]
name = "kmux"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
signal-hook = "0.4.4"
tempfile = "3.27.0"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
