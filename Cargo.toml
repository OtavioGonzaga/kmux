[package]
name = "ssh-kmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Run commands with a filtered view of an SSH agent"
categories = ["command-line-utilities", "authentication"]
keywords = ["ssh", "agent", "security"]
repository = "https://github.com/OtavioGonzaga/kmux"
readme = "README.md"

[lib]
name = "kmux"
path = "src/lib.rs"

[[bin]]
name = "kmux"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
signal-hook = "0.4.4"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
