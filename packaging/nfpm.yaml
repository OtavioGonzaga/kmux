name: kmux
arch: ${ARCH}
platform: linux
version: ${DEB_UPSTREAM_VERSION}
release: "1"
section: utils
maintainer: Otavio Gonzaga <otaviolgonzaga@gmail.com>
description: Run commands with a filtered view of an SSH agent.
homepage: https://github.com/OtavioGonzaga/kmux
license: MIT
contents:
  - src: dist/kmux
    dst: /usr/bin/kmux
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/kmux/LICENSE
  - src: README.md
    dst: /usr/share/doc/kmux/README.md
  - src: CHANGELOG.md
    dst: /usr/share/doc/kmux/CHANGELOG.md
