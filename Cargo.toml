[package]
name = "kmux"
version = "0.1.0"
edition = "2024"
description = "Run commands with a filtered view of an SSH agent"
categories = ["command-line-utilities", "authentication"]
keywords = ["ssh", "agent", "security"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.5.60", features = ["derive"] }
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
toml = "1.1.6"
